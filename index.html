<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeTrack — Weekly P&L</title>
<style>
:root {
    --bg:     #0d1117;
    --bg2:    #161b22;
    --bg3:    #1c2128;
    --bg4:    #21262d;
    --border: #2d333b;
    --text:   #e6edf3;
    --muted:  #768390;
    --green:  #3fb950;
    --red:    #f85149;
    --blue:   #58a6ff;
    --gold:   #d29922;
    --purple: #bc8cff;
    --name-w: 130px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; overflow:hidden; }
body { display:flex; flex-direction:column; }

/* ── TOP BAR ─────────────────────────────────── */
.topbar {
    flex-shrink:0; background:var(--bg2); border-bottom:1px solid var(--border);
    padding:0 14px; display:flex; align-items:center; gap:12px; height:40px;
}
.logo { font-size:.95rem; font-weight:700; letter-spacing:-.4px; white-space:nowrap; }
.logo em { color:var(--blue); font-style:normal; }
.week-lbl { font-size:10px; color:var(--muted); white-space:nowrap; }
.vdiv { width:1px; height:18px; background:var(--border); flex-shrink:0; }
.traders-wrap { display:flex; align-items:center; gap:5px; flex:1; overflow:hidden; }
.chip { display:flex; align-items:center; gap:4px; background:var(--bg3);
    border:1px solid var(--border); border-radius:20px; padding:2px 8px 2px 6px;
    font-size:11px; white-space:nowrap; flex-shrink:0; }
.chip-dot { width:6px; height:6px; border-radius:50%; }
.chip-rm { background:none; border:none; color:var(--muted); cursor:pointer;
    padding:0 0 0 3px; font-size:13px; line-height:1; font-family:inherit; transition:color .12s; }
.chip-rm:hover { color:var(--red); }
.add-form { display:flex; gap:5px; align-items:center; flex-shrink:0; }
.add-form input { background:var(--bg3); border:1px solid var(--border); border-radius:5px;
    color:var(--text); padding:3px 8px; font-size:11px; outline:none; font-family:inherit;
    width:130px; transition:border-color .15s; }
.add-form input:focus { border-color:var(--blue); }
.add-form input::placeholder { color:var(--muted); }
.topbar-btns { display:flex; gap:5px; align-items:center; flex-shrink:0; margin-left:auto; }

/* connection dot */
.conn-dot {
    width:7px; height:7px; border-radius:50%; flex-shrink:0;
    background:var(--muted); transition:background .3s;
}
.conn-dot.online  { background:var(--green); }
.conn-dot.offline { background:var(--red); }

/* ── SAVE BUTTON ─────────────────────────────── */
.btn-save {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    min-width: 74px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 5px;
    padding: 3px 11px;
    cursor: default;
    font-family: inherit;
    transition: background .2s, border-color .2s, color .2s, box-shadow .2s;
}
.btn-save.pending {
    background: rgba(88,166,255,.1);
    border-color: var(--blue);
    color: var(--blue);
    cursor: pointer;
    animation: save-pulse 1.6s ease-in-out infinite;
}
.btn-save.pending:hover {
    background: rgba(88,166,255,.22);
}
.btn-save.saving {
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
    cursor: wait;
}
.btn-save.saved {
    background: rgba(63,185,80,.13);
    border-color: var(--green);
    color: var(--green);
    cursor: default;
}
@keyframes save-pulse {
    0%,100% { box-shadow: 0 0 0 0   rgba(88,166,255,.5); }
    50%      { box-shadow: 0 0 0 4px rgba(88,166,255,0);  }
}

/* ── STATS BAR ────────────────────────────────── */
.statsbar { flex-shrink:0; background:var(--bg2); border-bottom:1px solid var(--border);
    display:flex; align-items:stretch; height:38px; }
.stat { display:flex; align-items:center; gap:8px; padding:0 16px; border-right:1px solid var(--border); }
.stat-lbl { font-size:9px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.7px; }
.stat-val { font-size:.95rem; font-weight:700; }
.stat-sub { font-size:9px; color:var(--muted); }
.pos { color:var(--green); } .neg { color:var(--red); } .neu { color:var(--muted); }

/* ── BUTTONS ─────────────────────────────────── */
.btn { cursor:pointer; border:1px solid transparent; border-radius:5px; font-size:11px;
    font-weight:500; padding:3px 11px; transition:all .14s; white-space:nowrap; font-family:inherit; }
.btn-blue  { background:var(--blue); color:#0d1117; border-color:var(--blue); }
.btn-blue:hover { background:#79c0ff; }
.btn-red   { background:transparent; border-color:var(--red); color:var(--red); }
.btn-red:hover { background:var(--red); color:#fff; }
.btn-ghost { background:transparent; border-color:var(--border); color:var(--muted); }
.btn-ghost:hover { border-color:var(--blue); color:var(--blue); }

/* ── TABLE AREA ──────────────────────────────── */
.table-section { flex:1; overflow:auto; min-height:0; }

/* ── TABLE ───────────────────────────────────── */
table { border-collapse:collapse; table-layout:fixed; min-width:100%; }

th.name-th, td.name-td {
    position:sticky; left:0; z-index:4;
    width:var(--name-w); min-width:var(--name-w); max-width:var(--name-w);
}
th.tot-th, td.tot-td {
    position:sticky; right:0; z-index:4;
    text-align:right; font-weight:700; min-width:88px;
}
thead { position:sticky; top:0; z-index:10; }

tr.hdr-cat th {
    background:var(--bg3); border-bottom:1px solid var(--border);
    padding:4px 0; text-align:center;
    font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px;
}
tr.hdr-cat th.name-th { background:var(--bg3); border-right:1px solid var(--border); }
tr.hdr-cat th.tot-th  { background:var(--bg3); border-left:1px solid var(--border); }

tr.hdr-pairs th {
    background:var(--bg3); border-bottom:2px solid var(--border);
    padding:5px 3px; text-align:center;
    font-size:9px; font-weight:700; white-space:nowrap; color:var(--muted);
}
tr.hdr-pairs th.name-th {
    text-align:left; padding-left:12px; border-right:1px solid var(--border);
    font-size:9px; letter-spacing:.7px; text-transform:uppercase;
}
tr.hdr-pairs th.tot-th { border-left:1px solid var(--border); color:var(--text); padding-right:10px; }

.cat-futures { color:var(--gold)   !important; }
.cat-forex   { color:var(--blue)   !important; }
.cat-crypto  { color:var(--purple) !important; }
.border-after { border-right:1px solid var(--border) !important; }

/* ── DAY SECTION HEADER ──────────────────────── */
tr.day-hdr td {
    background:var(--bg4) !important;
    border-top:2px solid var(--border); border-bottom:1px solid var(--border);
    padding:6px 0 6px 12px;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.8px;
}
tr.day-hdr td.name-td { background:var(--bg4) !important; border-right:1px solid var(--border); }
tr.day-hdr td.tot-td  { background:var(--bg4) !important; border-left:1px solid var(--border);
    padding-right:10px; font-size:9px; color:var(--muted); }

/* ── TRADER INPUT ROWS ───────────────────────── */
tr.trader-row td {
    border-bottom:1px solid rgba(45,51,59,0.4);
    padding:0 3px; height:28px; vertical-align:middle;
}
tr.trader-row td.name-td {
    background:var(--bg2); border-right:1px solid var(--border);
    padding-left:20px; font-size:11px; font-weight:600;
}
tr.trader-row td.tot-td {
    background:var(--bg2); border-left:1px solid var(--border);
    padding-right:10px; font-size:11px;
}
.trader-nm { display:flex; align-items:center; gap:5px; white-space:nowrap; }
.t-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
tr.trader-row:hover td        { background:rgba(88,166,255,.04); }
tr.trader-row:hover td.name-td{ background:rgba(88,166,255,.08); }
tr.trader-row:hover td.tot-td { background:rgba(88,166,255,.04); }

/* ── DAY TOTAL ROW ───────────────────────────── */
tr.day-total-row td {
    background:#0f2318 !important;
    border-top:1px solid rgba(63,185,80,.2); border-bottom:2px solid var(--border);
    padding:5px 3px; font-weight:700; font-size:11px; text-align:center;
}
tr.day-total-row td.name-td {
    background:#0f2318 !important; border-right:1px solid var(--border);
    text-align:left; padding-left:20px;
    font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--green);
}
tr.day-total-row td.tot-td {
    background:#0f2318 !important; border-left:1px solid var(--border);
    padding-right:10px; font-size:12px; text-align:right;
}

/* ── WEEK TOTAL ROW ──────────────────────────── */
tr.week-total-row td {
    background:var(--bg3) !important; border-top:3px solid var(--border);
    padding:7px 3px; font-weight:700; font-size:11px; text-align:center;
}
tr.week-total-row td.name-td {
    background:var(--bg3) !important; border-right:1px solid var(--border);
    text-align:left; padding-left:12px;
    font-size:9px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted);
}
tr.week-total-row td.tot-td {
    background:var(--bg3) !important; border-left:1px solid var(--border);
    padding-right:10px; font-size:13px; text-align:right;
}

/* ── P&L INPUT ───────────────────────────────── */
.pnl { width:100%; background:transparent; border:1px solid transparent;
    border-radius:3px; color:var(--muted); padding:2px 3px;
    font-size:11px; text-align:center; outline:none; font-family:inherit;
    transition:all .12s; min-width:58px; }
.pnl:hover { border-color:var(--border); background:var(--bg3); }
.pnl:focus { border-color:var(--blue); background:var(--bg3); }
.pnl.p { color:var(--green); font-weight:600; }
.pnl.n { color:var(--red);   font-weight:600; }

/* ── MODAL ───────────────────────────────────── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
    z-index:500; align-items:center; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:10px;
    padding:20px; max-width:420px; width:90%; }
.modal h3 { font-size:.9rem; margin-bottom:6px; }
.modal p  { color:var(--muted); font-size:11px; margin-bottom:14px; line-height:1.5; }
.modal-actions { display:flex; gap:7px; justify-content:flex-end; }

/* ── TOAST / EMPTY ───────────────────────────── */
.toast { position:fixed; bottom:16px; right:16px; background:var(--bg3);
    border:1px solid var(--border); border-radius:6px; padding:8px 14px; font-size:11px;
    opacity:0; transform:translateY(6px); transition:all .18s; pointer-events:none; z-index:9999; }
.toast.show { opacity:1; transform:translateY(0); }
.empty { text-align:center; padding:60px; color:var(--muted); }
.empty .ico { font-size:2rem; margin-bottom:8px; }
.empty p { font-size:11px; }

/* syncing flash on remote update */
@keyframes syncflash { 0%{background:rgba(88,166,255,.18)} 100%{background:transparent} }
.sync-flash { animation:syncflash .6s ease-out; }

/* ── TODAY HIGHLIGHT ─────────────────────────── */
tr.day-hdr.today td {
    background: #0d1f35 !important;
    border-top: 2px solid var(--blue) !important;
    color: var(--blue) !important;
}
tr.day-hdr.today td.name-th,
tr.day-hdr.today td.name-td {
    background: #0d1f35 !important;
    border-right: 1px solid var(--blue) !important;
}
tr.day-hdr.today td.tot-td {
    background: #0d1f35 !important;
    border-left: 1px solid var(--blue) !important;
}
.today-badge {
    display: inline-block;
    background: var(--blue);
    color: #0d1117;
    font-size: 8px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 7px;
    text-transform: uppercase;
    letter-spacing: .6px;
    vertical-align: middle;
}
/* solid backgrounds — no transparency so sticky columns don't bleed through */
tr.trader-row.today td {
    background: #111a27 !important;
}
tr.trader-row.today td.name-td {
    background: #14203199 !important;
    background: #152030 !important;
    /* inset box-shadow = visual left border with zero layout impact */
    box-shadow: inset 3px 0 0 var(--blue);
    padding-left: 20px;
}
tr.trader-row.today td.tot-td {
    background: #111a27 !important;
}
tr.trader-row.today:hover td         { background: #162236 !important; }
tr.trader-row.today:hover td.name-td { background: #1a2a40 !important; }
tr.trader-row.today:hover td.tot-td  { background: #162236 !important; }

tr.day-total-row.today td {
    background: #091828 !important;
    border-top: 1px solid rgba(88,166,255,.2) !important;
}
tr.day-total-row.today td.name-td {
    background: #091828 !important;
    color: var(--blue) !important;
    box-shadow: inset 3px 0 0 var(--blue);
    padding-left: 20px;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div>
        <div class="logo"><em>Trade</em>Track</div>
        <div class="week-lbl" id="week-lbl"></div>
    </div>
    <div class="vdiv"></div>
    <div class="traders-wrap" id="traders-wrap">
        <div class="add-form">
            <input type="text" id="trader-inp" placeholder="Add trader…" maxlength="16"
                onkeydown="if(event.key==='Enter')addTrader()">
            <button class="btn btn-blue" onclick="addTrader()">+ Add</button>
        </div>
    </div>
    <div class="topbar-btns">
        <div class="conn-dot" id="conn-dot" title="Connecting…"></div>
        <button class="btn-save" id="save-btn" onclick="doSave()">Save</button>
        <button class="btn btn-red" onclick="openModal('rst-modal')">↺ Reset</button>
    </div>
</div>

<!-- STATS BAR -->
<div class="statsbar">
    <div class="stat">
        <div class="stat-lbl">Week P&L</div>
        <div class="stat-val neu" id="s-grand">$0.00</div>
    </div>
    <div class="stat">
        <div class="stat-lbl">Best Pair</div>
        <div>
            <div class="stat-val pos" id="s-best">—</div>
            <div class="stat-sub"        id="s-best-v"></div>
        </div>
    </div>
    <div class="stat">
        <div class="stat-lbl">Worst Pair</div>
        <div>
            <div class="stat-val neg" id="s-worst">—</div>
            <div class="stat-sub"         id="s-worst-v"></div>
        </div>
    </div>
    <div class="stat">
        <div class="stat-lbl">Traders</div>
        <div class="stat-val neu" id="s-traders">0</div>
    </div>
</div>

<!-- TABLE -->
<div class="table-section">
    <div id="tbl-area"></div>
</div>

<!-- RESET MODAL -->
<div class="modal-bg" id="rst-modal">
    <div class="modal">
        <h3>Reset This Week?</h3>
        <p>Clears all P&L entries for everyone. Trader names are kept. Cannot be undone.</p>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal('rst-modal')">Cancel</button>
            <button class="btn btn-red"   onclick="doReset()">Yes, Reset</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ── Firebase init ────────────────────────────────────────
const firebaseConfig = {
    apiKey:            "AIzaSyCf3-WctE9SrKZ8e2yEYQaTynVVxJBYg9Y",
    authDomain:        "tradetrack-e70b0.firebaseapp.com",
    databaseURL:       "https://tradetrack-e70b0-default-rtdb.firebaseio.com",
    projectId:         "tradetrack-e70b0",
    storageBucket:     "tradetrack-e70b0.firebasestorage.app",
    messagingSenderId: "888487096918",
    appId:             "1:888487096918:web:a9e35053a0246523bdc1f7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Connection status
db.ref('.info/connected').on('value', snap => {
    const dot = document.getElementById('conn-dot');
    if (snap.val()) {
        dot.className = 'conn-dot online';
        dot.title = 'Live — connected';
    } else {
        dot.className = 'conn-dot offline';
        dot.title = 'Offline';
    }
});

// ── Constants ────────────────────────────────────────────
const CATS = {
    FUTURES: ['XAUUSD','XAGUSD','USOIL','NAS100'],
    FOREX: [
        'AUDCAD','AUDCHF','AUDNZD','AUDJPY','AUDUSD',
        'CADCHF','CADJPY','CHFJPY',
        'EURAUD','EURCAD','EURCHF','EURGBP','EURJPY','EURNZD','EURUSD',
        'GBPAUD','GBPCAD','GBPCHF','GBPJPY','GBPNZD','GBPUSD',
        'NZDCAD','NZDCHF','NZDJPY','NZDUSD',
        'USDCAD','USDCHF','USDJPY'
    ],
    CRYPTO: ['BTCUSD','ETHUSD','SOLUSD']
};
const ALL_PAIRS  = [...CATS.FUTURES, ...CATS.FOREX, ...CATS.CRYPTO];
const PAIR_CAT   = {};
Object.entries(CATS).forEach(([c,pairs]) => pairs.forEach(p => PAIR_CAT[p] = c));
const CAT_LAST_SET = new Set([CATS.FUTURES.at(-1), CATS.FOREX.at(-1)]);

const DAYS     = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const DAY_KEYS = ['mon','tue','wed','thu','fri'];

const COLORS = [
    '#58a6ff','#3fb950','#f85149','#d29922',
    '#bc8cff','#ff7b72','#79c0ff','#56d364','#ffa657'
];

// ── State ────────────────────────────────────────────────
let partners    = [];   // [{name, color}]
let data        = {};   // data[traderName][dayKey][pair] = string
let weekKey     = getMondayKey();
let tableReady  = false;
let pendingWrites = {};  // Firebase path → value (null = delete)

// ── Week helpers ─────────────────────────────────────────
function getMondayKey() {
    const now = new Date(), d = now.getDay();
    const mon = new Date(now);
    mon.setDate(now.getDate() - (d === 0 ? 6 : d - 1));
    return mon.toISOString().split('T')[0];
}
function weekLabel(key) {
    const mon = new Date(key + 'T12:00:00');
    const fri = new Date(mon); fri.setDate(fri.getDate() + 4);
    const f = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    return `${f(mon)} – ${f(fri)}, ${fri.getFullYear()}`;
}

function getCurrentDayKey() {
    const d = new Date().getDay(); // 0=Sun … 6=Sat
    return {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'}[d] || null;
}

// Firebase key-safe trader name (no .#$[]/)
function fk(name) { return name.replace(/[.#$\[\]\/]/g, '_'); }

// ── Firebase refs ────────────────────────────────────────
const partnersRef  = db.ref('partners');
const weekDataRef  = () => db.ref('weeks/' + weekKey);

// ── Save button logic ─────────────────────────────────────
function queueWrite(path, value) {
    pendingWrites[path] = (value === '' || value === undefined) ? null : value;
    setSaveState('pending');
}

function setSaveState(state) {
    const btn = document.getElementById('save-btn');
    if (!btn) return;
    btn.className = 'btn-save ' + state;
    if (state === 'idle')    { btn.textContent = 'Save'; }
    if (state === 'pending') { btn.textContent = '● Save'; }
    if (state === 'saving')  { btn.textContent = 'Saving…'; }
    if (state === 'saved')   { btn.textContent = '✓ Saved'; }
}

function doSave() {
    const btn = document.getElementById('save-btn');
    if (!btn || btn.className.includes('idle') || btn.className.includes('saving') || btn.className.includes('saved')) return;
    if (Object.keys(pendingWrites).length === 0) return;

    setSaveState('saving');

    db.ref().update(pendingWrites)
        .then(() => {
            pendingWrites = {};
            setSaveState('saved');
            setTimeout(() => setSaveState('idle'), 2200);
        })
        .catch(() => {
            setSaveState('pending');
            showToast('Save failed — check connection');
        });
}

// ── Firebase listeners ───────────────────────────────────

// Partners — full re-render when list changes
partnersRef.on('value', snap => {
    const val = snap.val();
    partners = val ? Object.values(val) : [];
    renderChips();
    renderTable();
    renderStats();
    tableReady = true;
    // after partners are ready, start listening to data
    setupDataListener();
});

let dataListenerActive = false;
function setupDataListener() {
    if (dataListenerActive) return;
    dataListenerActive = true;

    weekDataRef().on('value', snap => {
        const newData = snap.val() || {};
        applyRemoteData(newData);
    });
}

// Smart update — only touch cells that changed and aren't focused
function applyRemoteData(newData) {
    const focused = document.activeElement;

    partners.forEach(p => {
        const key = fk(p.name);
        DAY_KEYS.forEach(dk => {
            ALL_PAIRS.forEach(pair => {
                const remoteRaw = newData[key]?.[dk]?.[pair];
                const remoteVal = (remoteRaw === null || remoteRaw === undefined) ? '' : String(remoteRaw);
                const localRaw  = data[key]?.[dk]?.[pair];
                const localVal  = (localRaw  === null || localRaw  === undefined) ? '' : String(localRaw);

                if (remoteVal !== localVal) {
                    // Update DOM cell if not focused
                    const inp = document.querySelector(
                        `input[data-trader="${esc(p.name)}"][data-day="${dk}"][data-pair="${esc(pair)}"]`
                    );
                    if (inp && inp !== focused) {
                        inp.value = remoteVal;
                        styleInp(inp);
                        // brief blue flash to show the change
                        inp.closest('td').classList.remove('sync-flash');
                        void inp.closest('td').offsetWidth;
                        inp.closest('td').classList.add('sync-flash');
                    }
                }
            });
        });
    });

    data = newData;
    refreshAllTotals();
    renderStats();
}

// ── Math ─────────────────────────────────────────────────
function gv(trader, day, pair) {
    return parseFloat(data[fk(trader)]?.[day]?.[pair] || '') || 0;
}
function traderDayTotal(trader, day) {
    return ALL_PAIRS.reduce((s,p) => s + gv(trader, day, p), 0);
}
function dayPairTotal(day, pair) {
    return partners.reduce((s,p) => s + gv(p.name, day, pair), 0);
}
function dayTotal(day) {
    return partners.reduce((s,p) => s + traderDayTotal(p.name, day), 0);
}
function weekPairTotal(pair) {
    return DAY_KEYS.reduce((s,d) => s + dayPairTotal(d, pair), 0);
}
function grandTotal() {
    return ALL_PAIRS.reduce((s,pair) => s + weekPairTotal(pair), 0);
}

function fmt(v) {
    if (v === 0) return '$0.00';
    const a = Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    return (v>0?'+$':'-$') + a;
}
function cc(v) { return v>0?'pos':v<0?'neg':'neu'; }

// ── Render (full table build) ────────────────────────────
function render() {
    document.getElementById('week-lbl').textContent = weekLabel(weekKey);
    renderChips();
    renderTable();
    renderStats();
}

function renderChips() {
    const wrap = document.getElementById('traders-wrap');
    const add  = wrap.querySelector('.add-form');
    Array.from(wrap.children).forEach(c => { if (!c.classList.contains('add-form')) c.remove(); });
    partners.forEach(p => {
        const el = document.createElement('div');
        el.className = 'chip';
        el.innerHTML =
            `<div class="chip-dot" style="background:${p.color}"></div>` +
            `<span>${esc(p.name)}</span>` +
            `<button class="chip-rm" onclick="removeTrader('${escJ(p.name)}')" title="Remove">×</button>`;
        wrap.insertBefore(el, add);
    });
}

function renderTable() {
    const area = document.getElementById('tbl-area');
    if (partners.length === 0) {
        area.innerHTML = `<div class="empty"><div class="ico">📊</div><p>Add traders above to start tracking.</p></div>`;
        return;
    }

    let h = '<table><thead>';

    // Category row
    h += '<tr class="hdr-cat"><th class="name-th"></th>';
    Object.entries(CATS).forEach(([cat, pairs]) => {
        const color  = cat==='FUTURES'?'var(--gold)':cat==='FOREX'?'var(--blue)':'var(--purple)';
        const border = cat!=='CRYPTO' ? 'border-right:1px solid var(--border)' : '';
        h += `<th colspan="${pairs.length}" style="color:${color};${border}">${cat}</th>`;
    });
    h += '<th class="tot-th"></th></tr>';

    // Pair row
    h += '<tr class="hdr-pairs"><th class="name-th">DAY / TRADER</th>';
    ALL_PAIRS.forEach(pair => {
        const catCls = 'cat-' + PAIR_CAT[pair].toLowerCase();
        const ba = CAT_LAST_SET.has(pair) ? ' border-after' : '';
        h += `<th class="${catCls}${ba}">${pair}</th>`;
    });
    h += '<th class="tot-th">TOTAL</th></tr></thead><tbody>';

    // Day sections
    const todayKey = getCurrentDayKey();
    DAY_KEYS.forEach((dk, di) => {
        const dt      = dayTotal(dk);
        const isToday = dk === todayKey;
        const todayCls = isToday ? ' today' : '';

        // Day header
        const dayLabel = DAYS[di] + (isToday ? ' <span class="today-badge">Today</span>' : '');
        h += `<tr class="day-hdr${todayCls}"><td class="name-td">${dayLabel}</td>`;
        ALL_PAIRS.forEach(pair => {
            const ba = CAT_LAST_SET.has(pair) ? ' class="border-after"' : '';
            h += `<td${ba} style="background:${isToday?'#0d1f35':'var(--bg4)'}"></td>`;
        });
        h += `<td class="tot-td">${dt!==0?`<span class="${cc(dt)}">${fmt(dt)}</span>`:''}</td></tr>`;

        // Trader rows
        partners.forEach(p => {
            const tdt = traderDayTotal(p.name, dk);
            h += `<tr class="trader-row${todayCls}"><td class="name-td">
                    <div class="trader-nm">
                        <div class="t-dot" style="background:${p.color}"></div>
                        <span>${esc(p.name)}</span>
                    </div></td>`;
            ALL_PAIRS.forEach(pair => {
                const raw = data[fk(p.name)]?.[dk]?.[pair] ?? '';
                const n   = parseFloat(raw) || 0;
                const ic  = raw!=='' ? (n>0?'p':n<0?'n':'') : '';
                const ba  = CAT_LAST_SET.has(pair) ? ' class="border-after"' : '';
                h += `<td${ba}><input type="number" class="pnl ${ic}"` +
                     ` value="${esc(String(raw))}" placeholder="0" step="0.01"` +
                     ` data-trader="${esc(p.name)}" data-day="${dk}" data-pair="${esc(pair)}"` +
                     ` oninput="onInput(this)" onblur="onBlur(this)"></td>`;
            });
            h += `<td class="tot-td ${cc(tdt)}" id="tdt-${sid(p.name)}-${dk}">${tdt!==0?fmt(tdt):'<span style="color:var(--muted)">—</span>'}</td>`;
            h += '</tr>';
        });

        // Day combined total
        h += `<tr class="day-total-row${todayCls}"><td class="name-td">Day Total</td>`;
        ALL_PAIRS.forEach(pair => {
            const t  = dayPairTotal(dk, pair);
            const ba = CAT_LAST_SET.has(pair) ? ' class="border-after"' : '';
            h += `<td id="dpt-${dk}-${sid(pair)}"${ba} style="color:${t>0?'var(--green)':t<0?'var(--red)':'var(--muted)'}">` +
                 (t!==0?fmt(t):'—') + `</td>`;
        });
        h += `<td class="tot-td ${cc(dt)}" id="dt-${dk}">${dt!==0?fmt(dt):'<span style="color:var(--muted)">—</span>'}</td></tr>`;
    });

    // Week total row
    const gt = grandTotal();
    h += '<tr class="week-total-row"><td class="name-td">Week Total</td>';
    ALL_PAIRS.forEach(pair => {
        const t  = weekPairTotal(pair);
        const ba = CAT_LAST_SET.has(pair) ? ' class="border-after"' : '';
        h += `<td id="wpt-${sid(pair)}"${ba} style="color:${t>0?'var(--green)':t<0?'var(--red)':'var(--muted)'}">` +
             (t!==0?fmt(t):'—') + `</td>`;
    });
    h += `<td class="tot-td ${cc(gt)}" id="ggt">${fmt(gt)}</td>`;
    h += '</tr></tbody></table>';

    area.innerHTML = h;
}

function renderStats() {
    const gt = grandTotal();
    const ge = document.getElementById('s-grand');
    if (!ge) return;
    ge.className = 'stat-val ' + cc(gt);
    ge.textContent = fmt(gt);
    document.getElementById('s-traders').textContent = partners.length;

    let best=null, worst=null, bv=-Infinity, wv=Infinity;
    ALL_PAIRS.forEach(pair => {
        const t = weekPairTotal(pair);
        const hasData = partners.some(p => DAY_KEYS.some(d => {
            const v = data[fk(p.name)]?.[d]?.[pair];
            return v !== undefined && v !== '' && v !== null;
        }));
        if (!hasData) return;
        if (t > bv) { bv=t; best=pair; }
        if (t < wv) { wv=t; worst=pair; }
    });
    document.getElementById('s-best').textContent    = best  || '—';
    document.getElementById('s-best-v').textContent  = best  ? fmt(bv) : '';
    document.getElementById('s-worst').textContent   = worst || '—';
    document.getElementById('s-worst-v').textContent = worst ? fmt(wv) : '';
}

// Refresh all total cells without full re-render
function refreshAllTotals() {
    DAY_KEYS.forEach(dk => {
        partners.forEach(p => {
            const tdt = traderDayTotal(p.name, dk);
            setCell('tdt-'+sid(p.name)+'-'+dk, tdt, true);
        });
        ALL_PAIRS.forEach(pair => {
            const t = dayPairTotal(dk, pair);
            const el = document.getElementById('dpt-'+dk+'-'+sid(pair));
            if (el) { el.style.color = t>0?'var(--green)':t<0?'var(--red)':'var(--muted)'; el.textContent = t!==0?fmt(t):'—'; }
        });
        const dt = dayTotal(dk);
        setCell('dt-'+dk, dt, true);
        // day header total
        document.querySelectorAll('tr.day-hdr').forEach((row,i) => {
            if (DAY_KEYS[i] === dk) {
                const tc = row.querySelector('td.tot-td');
                if (tc) tc.innerHTML = dt!==0?`<span class="${cc(dt)}">${fmt(dt)}</span>`:'';
            }
        });
    });
    ALL_PAIRS.forEach(pair => {
        const t = weekPairTotal(pair);
        const el = document.getElementById('wpt-'+sid(pair));
        if (el) { el.style.color = t>0?'var(--green)':t<0?'var(--red)':'var(--muted)'; el.textContent = t!==0?fmt(t):'—'; }
    });
    const gt = grandTotal();
    setCell('ggt', gt, false);
}

function setCell(id, val, dash) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = el.className.replace(/\b(pos|neg|neu)\b/g,'').trim() + ' ' + cc(val);
    el.innerHTML = val!==0 ? fmt(val) : (dash ? '<span style="color:var(--muted)">—</span>' : '$0.00');
}

// ── Cell events ──────────────────────────────────────────
function onInput(inp) {
    const { trader, day, pair } = inp.dataset;
    const val = inp.value;
    const n   = parseFloat(val);
    const isBlank = val === '' || isNaN(n) || n === 0;

    // Update local state — treat 0 same as empty
    if (!data[fk(trader)])      data[fk(trader)] = {};
    if (!data[fk(trader)][day]) data[fk(trader)][day] = {};
    if (isBlank) {
        delete data[fk(trader)][day][pair];
    } else {
        data[fk(trader)][day][pair] = val;
    }

    styleInp(inp);

    // Update totals immediately in DOM
    const tdt = traderDayTotal(trader, day);
    setCell('tdt-'+sid(trader)+'-'+day, tdt, true);

    const dpt = dayPairTotal(day, pair);
    const dptEl = document.getElementById('dpt-'+day+'-'+sid(pair));
    if (dptEl) { dptEl.style.color=dpt>0?'var(--green)':dpt<0?'var(--red)':'var(--muted)'; dptEl.textContent=dpt!==0?fmt(dpt):'—'; }

    const dt = dayTotal(day);
    setCell('dt-'+day, dt, true);
    document.querySelectorAll('tr.day-hdr').forEach((row,i) => {
        if (DAY_KEYS[i]===day) {
            const tc=row.querySelector('td.tot-td');
            if (tc) tc.innerHTML=dt!==0?`<span class="${cc(dt)}">${fmt(dt)}</span>`:'';
        }
    });

    const wpt = weekPairTotal(pair);
    const wptEl = document.getElementById('wpt-'+sid(pair));
    if (wptEl) { wptEl.style.color=wpt>0?'var(--green)':wpt<0?'var(--red)':'var(--muted)'; wptEl.textContent=wpt!==0?fmt(wpt):'—'; }

    setCell('ggt', grandTotal(), false);
    renderStats();

    const path = `weeks/${weekKey}/${fk(trader)}/${day}/${pair}`;
    if (isBlank) {
        // 0 or empty — remove from pending queue, no save needed
        delete pendingWrites[path];
        if (Object.keys(pendingWrites).length === 0) setSaveState('idle');
        // Also silently clean up Firebase in case a real value was there before
        db.ref(path).remove();
    } else {
        // Real value — queue for Save
        queueWrite(path, val);
    }
}

function onBlur(inp) {
    const { trader, day, pair } = inp.dataset;
    const n = parseFloat(inp.value);
    const isBlank = inp.value === '' || isNaN(n) || n === 0;
    if (isBlank) {
        if (data[fk(trader)]?.[day]) delete data[fk(trader)][day][pair];
        const path = `weeks/${weekKey}/${fk(trader)}/${day}/${pair}`;
        delete pendingWrites[path];
        if (Object.keys(pendingWrites).length === 0) setSaveState('idle');
        db.ref(path).remove();
    }
}

function styleInp(inp) {
    const n = parseFloat(inp.value);
    inp.className = 'pnl' + (isNaN(n) || n === 0 ? '' : n > 0 ? ' p' : ' n');
    // 0 keeps base .pnl color (muted/grey), same as placeholder
}

// ── Traders ──────────────────────────────────────────────
function addTrader() {
    const inp  = document.getElementById('trader-inp');
    // Strip Firebase-invalid chars
    const name = inp.value.trim().replace(/[.#$\[\]\/]/g, '');
    if (!name) return;
    if (partners.find(p => p.name.toLowerCase()===name.toLowerCase())) { showToast('Already exists'); return; }
    if (partners.length >= COLORS.length) { showToast('Max '+COLORS.length+' traders'); return; }
    partners.push({ name, color: COLORS[partners.length] });
    inp.value = '';
    // Write partners to Firebase — all devices will get the new list instantly
    partnersRef.set(partners);
}

function removeTrader(name) {
    partners = partners.filter(p => p.name !== name);
    partners.forEach((p,i) => p.color = COLORS[i]);
    partnersRef.set(partners);
    // optionally remove their data too
    db.ref(`weeks/${weekKey}/${fk(name)}`).remove();
}

// ── Reset ─────────────────────────────────────────────────
function doReset() {
    data = {};
    pendingWrites = {};
    setSaveState('idle');
    closeModal('rst-modal');
    weekDataRef().remove();   // clear Firebase for everyone else
    renderTable();            // immediately wipe the DOM
    refreshAllTotals();
    renderStats();
    showToast('Week cleared for everyone');
}

// ── Modals ────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-bg').forEach(bg =>
    bg.addEventListener('click', e => { if(e.target===bg) bg.classList.remove('open'); })
);

// ── Toast ─────────────────────────────────────────────────
let _tt;
function showToast(msg) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2600);
}

// ── Utils ─────────────────────────────────────────────────
function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJ(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function sid(s)  { return String(s).replace(/[^a-zA-Z0-9]/g,'_'); }

// ── Unsaved changes warning on tab close ──────────────────
window.addEventListener('beforeunload', (e) => {
    if (Object.keys(pendingWrites).length > 0) {
        e.preventDefault();
        e.returnValue = '';
    }
});

// ── Boot ──────────────────────────────────────────────────
document.getElementById('week-lbl').textContent = weekLabel(weekKey);
// Firebase listeners handle the rest of the init
</script>
</body>
</html>
